# ==========================================
# FONTS
# ==========================================
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ==========================================
# WINDOW & LAYOUT
# ==========================================
# Match the rounded, airy spacing from Waybar/Rofi
window_padding_width 14
# Remove the titlebar entirely
hide_window_decorations yes
# Don't ask for confirmation when closing the terminal
confirm_os_window_close 0
inactive_text_alpha 0.82

# ==========================================
# BACKGROUND & TRANSPARENCY
# ==========================================
# Slightly stronger transparency for the same glass feel
background_opacity 0.80
dynamic_background_opacity yes
dim_opacity 0.90

# ==========================================
# CURSOR & UI FEEL
# ==========================================
cursor_shape beam
cursor_beam_thickness 1.5
cursor_stop_blinking_after 0
enable_audio_bell no
visual_bell_duration 0.0

# ==========================================
# CUSTOM COLOR PALETTE
# ==========================================
background #181825
foreground #cdd6f4
cursor     #89b4fa
cursor_text_color background
selection_background #313244
selection_foreground #ffffff

# Black
color0 #45475a
color8 #585b70
# Red
color1 #f38ba8
color9 #f38ba8
# Green
color2  #a6e3a1
color10 #a6e3a1
# Yellow
color3  #f9e2af
color11 #f9e2af
# Blue
color4  #89b4fa
color12 #89b4fa
# Magenta
color5  #cba6f7
